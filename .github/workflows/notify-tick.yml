name: Proactive Telegram notification tick

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Call the protected notification endpoint
        shell: bash
        env:
          NOTIFY_TICK_URL: ${{ secrets.NOTIFY_TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$NOTIFY_TICK_URL" || -z "$CRON_SECRET" ]]; then
            echo "Set NOTIFY_TICK_URL and CRON_SECRET in GitHub Actions secrets."
            exit 1
          fi
          curl --fail --silent --show-error \
            --max-time 120 \
            --retry 4 --retry-all-errors --retry-delay 5 \
            --request POST \
            --header "X-Cron-Secret: $CRON_SECRET" \
            "$NOTIFY_TICK_URL"
