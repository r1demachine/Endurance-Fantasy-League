name: Frontend checks

on:
  pull_request:
    branches: [main, "refactor/ui-*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run dialog logic and render tests
        run: npm test
      - name: Full frontend lint (informational; legacy violations tracked separately)
        run: npm run lint
        continue-on-error: true
      - name: Lint shared UI and dialog utilities
        run: npm run lint -- src/components/Modal.tsx src/components/dialog-utils.ts src/components/ui
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
