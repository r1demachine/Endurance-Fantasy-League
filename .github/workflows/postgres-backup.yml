name: Weekly encrypted PostgreSQL backup

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_AWS_REGION: ${{ secrets.BACKUP_AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client age
          aws --version
          age --version
          pg_dump --version

      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BACKUP_DATABASE_URL BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET BACKUP_AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY BACKUP_AGE_RECIPIENT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is not configured: $name"
              exit 1
            fi
          done

      - name: Dump, compress, encrypt, and upload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="endurance-fantasy-postgres-${stamp}.sql.gz.age"

          pg_dump "$BACKUP_DATABASE_URL" --no-owner --no-privileges --format=plain \
            | gzip -9 > "$workdir/database.sql.gz"

          test -s "$workdir/database.sql.gz"
          age --recipient "$BACKUP_AGE_RECIPIENT" \
            --output "$workdir/$archive" "$workdir/database.sql.gz"
          test -s "$workdir/$archive"

          aws s3 cp "$workdir/$archive" \
            "s3://$BACKUP_S3_BUCKET/endurance-fantasy-league/$archive" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" \
            --only-show-errors

          echo "Encrypted database backup uploaded: $archive"
